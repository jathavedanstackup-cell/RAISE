services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raise}
      POSTGRES_DB: ${POSTGRES_DB:-raise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raise} -d ${POSTGRES_DB:-raise}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
