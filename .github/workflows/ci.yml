name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raise
          POSTGRES_PASSWORD: raise
          POSTGRES_DB: raise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raise -d raise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://raise:raise@localhost:5432/raise
      # CP2 — restricted runtime role the CP2 migration creates; the app
      # (and the e2e isolation tests, which boot the real app) must never
      # connect as the superuser role above. See docs/decisions.md.
      APP_DATABASE_URL: postgresql://raise_app:raise_app@localhost:5432/raise
      JWT_STAFF_SECRET: ci-staff-secret-not-for-real-use
      JWT_CUSTOMER_SECRET: ci-customer-secret-not-for-real-use
      OTP_PROVIDER: dev
      OTP_DEV_FIXED_CODE: '424242'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate:deploy --workspace apps/api

      - name: Test
        run: npm run test

      - name: Test (e2e)
        run: npm run test:e2e
